[project]
name = "heldout-distance"
version = "0.1.0"
description = "Error against distance from the training data, re-analysed across three studies."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
heldout = "heldout_distance.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heldout_distance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
