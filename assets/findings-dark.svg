<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Six results from the studies listed below, each shown as a baseline and the number the study measured. The same results are in the table below."><rect width="1200" height="470" rx="14" fill="#1F2E43"/><text x="24" y="34" font-family="Georgia,'Times New Roman',serif" font-size="19" font-style="italic" fill="#B8C0CC">Six results. Grey is the baseline; the bold number is what the study measured.</text><rect x="24" y="52" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="48" y="90" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">Crop maps</text><text x="164" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">0.29</text><line x1="180" y1="142" x2="220" y2="142" stroke="#B8C0CC" stroke-width="2"/><path d="M212 135 L222 142 L212 149" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="238" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">0.21</text><text x="48" y="198" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">macro-F1: random split, then</text><text x="48" y="220" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">a whole image tile held out</text><rect x="416" y="52" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="440" y="90" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">3D views</text><text x="556" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">32.9</text><line x1="572" y1="142" x2="612" y2="142" stroke="#B8C0CC" stroke-width="2"/><path d="M604 135 L614 142 L604 149" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="630" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">31.0<tspan dx="10" font-size="21" font-weight="400" fill="#B8C0CC">dB</tspan></text><text x="440" y="198" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">PSNR: scattered test views, then</text><text x="440" y="220" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">an unseen patch of directions</text><rect x="808" y="52" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="832" y="90" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">Reward gaming</text><text x="948" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">0%</text><line x1="964" y1="142" x2="1004" y2="142" stroke="#B8C0CC" stroke-width="2"/><path d="M996 135 L1006 142 L996 149" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="1022" y="158" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">20%</text><text x="832" y="198" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">episodes gamed on an unseen exploit:</text><text x="832" y="220" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">honest-trained, then gaming-trained agents</text><rect x="24" y="272" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="48" y="310" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">Eval alerts</text><text x="164" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">17</text><line x1="180" y1="362" x2="220" y2="362" stroke="#B8C0CC" stroke-width="2"/><path d="M212 355 L222 362 L212 369" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="238" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">3<tspan dx="10" font-size="21" font-weight="400" fill="#B8C0CC">of 18</tspan></text><text x="48" y="418" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">clean runs with a false alert:</text><text x="48" y="440" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">a drop rule, then a paired test</text><rect x="416" y="272" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="440" y="310" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">Runtime prediction</text><text x="556" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">50%</text><line x1="572" y1="362" x2="612" y2="362" stroke="#B8C0CC" stroke-width="2"/><path d="M604 355 L614 362 L604 369" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="630" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">20%</text><text x="440" y="418" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">error on larger workloads:</text><text x="440" y="440" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">gradient boosting, then a simulator</text><rect x="808" y="272" width="368" height="198" rx="10" fill="#27374F" stroke="#3A4B66" stroke-width="1"/><text x="832" y="310" font-family="Georgia,'Times New Roman',serif" font-size="19" font-weight="600" fill="#F4F6F9">RAG scoring</text><text x="948" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" text-anchor="end" fill="#B8C0CC">−4.5</text><line x1="964" y1="362" x2="1004" y2="362" stroke="#B8C0CC" stroke-width="2"/><path d="M996 355 L1006 362 L996 369" fill="none" stroke="#B8C0CC" stroke-width="2"/><text x="1022" y="378" font-family="Georgia,'Times New Roman',serif" font-size="48" font-weight="600" fill="#E8825F">+8.5<tspan dx="10" font-size="21" font-weight="400" fill="#B8C0CC">points</tspan></text><text x="832" y="418" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">the same retrieval fix under</text><text x="832" y="440" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#B8C0CC">standard accuracy, then GC-Accuracy</text></svg>